# Named model/provider presets for bench.py --model-preset <name>.
#
# Add a new model to the benchmark matrix by adding an entry here — no new
# benchmark-<model>.yaml file needed. All presets share the same
# benchmark.yaml (tools, prompts, kernel_dir); only model/provider vary.
#
# Usage:
#   python3 bench.py --model-preset sonnet5
#   python3 bench.py --model-preset sonnet5 --tools grep,repowise
#
# Each run still lands in its own artifacts/<model>-<provider>/ dir (see
# bench.py run_dir_name), so presets never clobber each other's data.

ds4:
  model: deepseek/deepseek-v4-flash-0731
  provider: openrouter

gpt5.6:
  model: gpt-5.6-sol
  provider: github-copilot

sonnet5:
  model: claude-sonnet-5
  provider: github-copilot

hy3:
  model: "tencent/hy3:free"
  provider: nous

# Ollama (local / OpenAI-compatible). Requires pi to have the provider declared
# in models.json (pi 0.84.1 has no built-in ollama discovery); set
# OLLAMA_BASE_URL (default http://127.0.0.1:11434/v1). The model id after
# "ollama/" is what ollama serves (ollama list). See docs/ollama.md.
ollama:
  model: "ollama/qwen3.8:27b-q8_0"
  provider: ollama
